version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "bun"
    open-pull-requests-limit: 3
    groups:
      compatible-dependencies:
        patterns: ['*']
        update-types: [minor, patch]
    directory: "/"
    schedule:
      interval: "weekly"
