name: Publish to npm

on:
  push:
    tags:
      - "v*"

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # First run tests and build
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup-bun

      # Verify TypeScript compilation
      - name: TypeScript check
        run: bun run typecheck

      # Run tests with coverage
      - name: Run tests with coverage
        run: bun run test:coverage

      # Build the project
      - name: Build
        run: bun run build

      - name: Verify package artifacts
        run: |
          test -f dist/index.js
          test -f dist/index.d.ts
          test -x dist/cli.js
          bun -e 'await import("./dist/index.js")'

      # Create and verify example site
      - name: Create and verify example site
        run: |
          mkdir -p test-site
          cd test-site
          ../dist/cli.js init
          ../dist/cli.js generate

          # Verify site generation
          if [ ! -f "dist/index.html" ]; then
            echo "Site generation failed"
            exit 1
          fi

      # Upload build artifacts for the publish job
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/

  # Then publish to npm if tests pass
  publish:
    needs: test-and-build
    runs-on: ubuntu-latest
    # Skip this job if a PR (not needed for PRs)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup-bun
        with:
          install: "false"

      # Download the previously built artifacts
      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/

      # A rerun cannot overwrite an existing version; errors stop publication.
      - name: Check version and registry state
        id: check
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --test scripts/release-check.test.mjs
          node scripts/release-check.mjs "$RELEASE_TAG" --registry

      # Setup npm authentication
      - name: Setup npm authentication
        if: steps.check.outputs.should_publish == 'true'
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      # Publish to npm
      - name: Publish to npm
        if: steps.check.outputs.should_publish == 'true'
        run: |
          # Ensure dist directory is ready for publishing
          find dist -type f | sort

          # Use Bun to publish instead of npm
          bun install && bun publish --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Create GitHub Release for tags
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3.0.3
        with:
          name: Release ${{ steps.check.outputs.package_version }}
          body: |
            Release of version ${{ steps.check.outputs.package_version }}

            Please see the [changelog](https://github.com/kahwee/bunki/blob/main/CHANGELOG.md) for details.
          draft: false
          prerelease: false
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
