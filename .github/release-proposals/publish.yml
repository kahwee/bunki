# PROPOSAL ONLY. Move to .github/workflows/publish.yml only after access approval.
name: Publish npm package
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: npm-release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Validate metadata and registry state
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --test scripts/check-release-guard.mjs
          node scripts/release-check.mjs "$RELEASE_TAG" --registry
      - name: Require successful CI on this exact source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "$(git rev-parse "$GITHUB_SHA^{commit}")"
          git merge-base --is-ancestor "$source_sha" "origin/main"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$source_sha&per_page=100" > "$RUNNER_TEMP/ci.json"
          jq -e --arg sha "$source_sha" '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success" and .event == "push" and .head_branch == "main")] | length > 0' "$RUNNER_TEMP/ci.json"
      - run: bun ci
      - name: Check and build
        run: bun run typecheck && bun run format:check && bun run test:coverage && bun run build
      - name: Pack the checked output
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          bun pm pack --ignore-scripts --filename "$RUNNER_TEMP/release/package.tgz"
          node scripts/release-check.mjs "$RELEASE_TAG"
          tar -tzf "$RUNNER_TEMP"/release/*.tgz
          tar -xOf "$RUNNER_TEMP"/release/*.tgz package/package.json > "$RUNNER_TEMP/packed-package.json"
          node --input-type=module -e 'import { readFileSync } from "node:fs"; const source = JSON.parse(readFileSync("package.json")); const packed = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/packed-package.json")); if (packed.name !== source.name || packed.version !== source.version || packed.private) throw new Error("Packed package identity differs from checked source")'
      - name: Preserve top-level distribution assets for GitHub
        run: |
          mkdir -p "$RUNNER_TEMP/release-assets"
          find dist -maxdepth 1 -type f -exec cp {} "$RUNNER_TEMP/release-assets/" \;
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          retention-days: 7
      - name: Publish checked tarball with npm OIDC
        if: steps.metadata.outputs.should_publish == 'true'
        working-directory: ${{ runner.temp }}
        env:
          PRERELEASE: "false"
        run: |
          node -e 'const v=process.argv[1].split(".").map(Number); if(v[0]<11 || (v[0]===11 && (v[1]<5 || (v[1]===5 && v[2]<1)))) throw new Error("npm >=11.5.1 required")' "$(npm --version)"
          dist_tag=latest
          if [ "$PRERELEASE" = true ]; then dist_tag=next; fi
          npm publish "$RUNNER_TEMP"/release/*.tgz --ignore-scripts --access public --tag "$dist_tag"
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets
      - name: Verify source and preserve existing release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-check.mjs "$GITHUB_REF_NAME"
          python3 scripts/release-assets.py "$GITHUB_REF_NAME" release-assets
